# 本番サイトの全ページ検査（2026-11-16 新設）。
# 本番へのデプロイが終わるたびに、サイトマップの全ページと、各ページが読み込む CSS・JS・画像を1つずつ開いて確かめ、
# 主要ページは実際のブラウザ（スマホ幅・PC幅）で開いて画面を撮る。手動でも実行できる（Actions → Site check → Run workflow）。
# 画面の画像と結果は、実行結果の「Artifacts」（site-check）から見られる。
name: Site check
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: write # 画面の画像を ci-shots ブランチに保存するため
  issues: write
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CDN の切り替わりを少し待つ
        run: sleep 25
      - name: 全ページと読み込むファイルの確認
        id: files
        shell: bash
        continue-on-error: true
        run: set -o pipefail; node scripts/site-check.mjs https://kabuexlabs.com --out out | tee out-files.log
      - name: ブラウザの準備
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium webkit firefox >/dev/null
      - name: 主要ページをブラウザで開いて撮る
        id: shots
        shell: bash
        continue-on-error: true
        env:
          NODE_PATH: /tmp/pw/node_modules
          BROWSERS: chromium,webkit,firefox
        run: |
          set -o pipefail
          cp scripts/site-shots.mjs /tmp/pw/site-shots.mjs
          cd /tmp/pw && node site-shots.mjs https://kabuexlabs.com "$GITHUB_WORKSPACE/out/shots" | tee "$GITHUB_WORKSPACE/out-shots.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-check
          path: |
            out
            out-files.log
            out-shots.log
          retention-days: 14
      - name: 画面の画像を ci-shots ブランチに保存（毎回上書き）
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/shots-repo && mkdir -p /tmp/shots-repo && cd /tmp/shots-repo
          cp -r "$GITHUB_WORKSPACE/out" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/out-*.log . 2>/dev/null || true
          printf '{\n  "git": { "deploymentEnabled": false }\n}\n' > vercel.json
          printf '本番サイトの全ページ検査の結果（自動生成・毎回上書き）。%s のコミット %s\n' "$(date -u +%FT%TZ)" "$GITHUB_SHA" > README.md
          git init -q -b ci-shots && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "site-check: $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
      - name: 問題があれば Issue を作る
        if: steps.files.outcome == 'failure' || steps.shots.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "【要確認】本番サイトの全ページ検査で問題（${{ github.sha }}）" \
            --body "$(printf '全ページ検査で問題が見つかりました。\n\n```\n%s\n```\n\n```\n%s\n```\n\n実行ログと画面の画像: %s' "$(grep -E '^NG|結果' out-files.log | head -40)" "$(grep -E '^NG|^      |問題のあった' out-shots.log | head -40)" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          exit 1
